<style>
  /* --u = 1% da largura de um palco 16:9 que cabe na tela (ou 9:16 em pé) */
  :root {
    --u: min(1vw, 1.7778vh);
    --acento: #ff5c9e; --acento2: #ffa3cb; --texto: #8a2f5d;
    --titulo: 'Fredoka', 'Nunito', 'Segoe UI', sans-serif;
    --corpo: 'Nunito', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--corpo); color: var(--texto); }
  canvas { position: fixed; inset: 0; display: block; }

  .palco {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(var(--u) * 100); height: calc(var(--u) * 56.25);
    padding: calc(var(--u) * 5.6) calc(var(--u) * 5.4);
    display: grid; grid-template-columns: 57fr 31fr; gap: calc(var(--u) * 4);
    align-items: center;
  }

  /* ---------- vitrine da skin */
  .vitrine { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); min-width: 0; }
  .card {
    position: relative; aspect-ratio: 16 / 9; border-radius: calc(var(--u) * 2.2); overflow: hidden;
    border: calc(var(--u) * 0.5) solid #fff; background: var(--acento2);
    box-shadow: 0 0 0 calc(var(--u) * 0.35) var(--acento2), 0 calc(var(--u) * 1.2) calc(var(--u) * 3.5) rgba(255, 92, 158, 0.35);
  }
  .card img.arte {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .card img.arte.ativa { opacity: 1; animation: zoom var(--troca, 10s) linear both; }
  @keyframes zoom { from { transform: scale(1.03); } to { transform: scale(1.13); } }
  .card::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(90, 20, 55, 0.62), rgba(90, 20, 55, 0) 42%);
  }
  .placa {
    position: absolute; left: calc(var(--u) * 2); bottom: calc(var(--u) * 1.7); right: calc(var(--u) * 12); z-index: 2;
    display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 0.5);
    transition: opacity 0.6s, transform 0.6s;
  }
  .placa.trocando { opacity: 0; transform: translateY(calc(var(--u) * 0.8)); }
  .placa strong {
    font-family: var(--titulo); font-weight: 600; font-size: calc(var(--u) * 2.9); line-height: 1.05; color: #fff;
    text-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.8) rgba(120, 20, 70, 0.6);
  }
  .etiquetas { display: flex; gap: calc(var(--u) * 0.6); }
  .etiqueta {
    font-weight: 800; font-size: calc(var(--u) * 0.95); letter-spacing: 0.12em; text-transform: uppercase;
    background: #fff; color: var(--acento); padding: calc(var(--u) * 0.25) calc(var(--u) * 0.8); border-radius: 999px;
  }
  .etiqueta:empty { display: none; }
  .croma {
    position: absolute; right: calc(var(--u) * 1.4); bottom: calc(var(--u) * 1.4); z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.35);
    transition: opacity 0.6s;
  }
  .croma.oculto { opacity: 0; }
  .croma .bola {
    width: calc(var(--u) * 7.5); height: calc(var(--u) * 7.5); border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fff, #ffe3ef); border: calc(var(--u) * 0.35) solid var(--cor-croma, #fff);
    box-shadow: 0 0 0 calc(var(--u) * 0.25) #fff, 0 calc(var(--u) * 0.4) calc(var(--u) * 1.2) rgba(90, 20, 55, 0.4);
    display: grid; place-items: center; overflow: hidden;
  }
  .croma img { width: 118%; height: 118%; object-fit: contain; margin-top: 12%; }
  .croma span {
    font-weight: 800; font-size: calc(var(--u) * 0.85); letter-spacing: 0.1em; text-transform: uppercase; color: #fff;
    background: var(--cor-croma, var(--acento)); padding: calc(var(--u) * 0.2) calc(var(--u) * 0.7); border-radius: 999px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); white-space: nowrap;
  }
  .progresso { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 0.45); z-index: 3; background: rgba(255, 255, 255, 0.35); }
  .progresso i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acento2), #fff); }
  .progresso i.anda { animation: anda var(--troca, 10s) linear both; }
  @keyframes anda { to { width: 100%; } }

  .miniaturas { display: flex; justify-content: center; gap: calc(var(--u) * 0.8); flex-wrap: nowrap; min-height: calc(var(--u) * 4.6); align-items: center; }
  .miniaturas img {
    width: var(--mini, calc(var(--u) * 4)); aspect-ratio: 1; border-radius: 50%; object-fit: cover;
    border: calc(var(--u) * 0.28) solid #fff; opacity: 0.7; transform: scale(0.92);
    box-shadow: 0 calc(var(--u) * 0.25) calc(var(--u) * 0.7) rgba(255, 92, 158, 0.3);
    transition: transform 0.5s, opacity 0.5s, box-shadow 0.5s;
  }
  .miniaturas img.ativa { opacity: 1; transform: scale(1.18); box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--acento), 0 calc(var(--u) * 0.4) calc(var(--u) * 1) rgba(255, 92, 158, 0.5); }

  /* ---------- lado do título */
  .lado { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: calc(var(--u) * 1.8); min-width: 0; }
  .pilula {
    display: inline-flex; align-items: center; gap: calc(var(--u) * 0.6);
    font-weight: 800; font-size: calc(var(--u) * 1.05); letter-spacing: 0.16em; text-transform: uppercase;
    background: #fff; color: var(--acento); padding: calc(var(--u) * 0.5) calc(var(--u) * 1.3); border-radius: 999px;
    box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1) rgba(255, 92, 158, 0.25);
  }
  .pilula i { width: calc(var(--u) * 0.75); height: calc(var(--u) * 0.75); border-radius: 50%; background: var(--acento); animation: pisca 1.4s ease-in-out infinite; }
  @keyframes pisca { 50% { opacity: 0.25; transform: scale(0.7); } }
  h1 {
    margin: 0; font-family: var(--titulo); font-weight: 700; font-size: calc(var(--u) * 6.2); line-height: 0.98; color: var(--acento);
    --c: calc(var(--u) * 0.32);
    text-shadow:
      var(--c) 0 0 #fff, calc(var(--c) * -1) 0 0 #fff, 0 var(--c) 0 #fff, 0 calc(var(--c) * -1) 0 #fff,
      var(--c) var(--c) 0 #fff, calc(var(--c) * -1) var(--c) 0 #fff, var(--c) calc(var(--c) * -1) 0 #fff, calc(var(--c) * -1) calc(var(--c) * -1) 0 #fff,
      0 calc(var(--u) * 0.75) 0 var(--acento2), 0 calc(var(--u) * 1) calc(var(--u) * 2) rgba(255, 92, 158, 0.35);
  }
  .junto { white-space: nowrap; }
  .pontos i { display: inline-block; font-style: normal; animation: pula 1.3s ease-in-out infinite; }
  .pontos i:nth-child(2) { animation-delay: 0.15s; }
  .pontos i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pula { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-0.18em); } }

  .tempo { display: flex; align-items: center; gap: calc(var(--u) * 1.6); width: 100%; }
  .bolha {
    position: relative; flex: none; width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 35% 30%, #fff, rgba(255, 255, 255, 0.75) 60%, rgba(255, 220, 235, 0.8));
    border: calc(var(--u) * 0.45) solid #fff;
    box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--acento2), 0 calc(var(--u) * 0.8) calc(var(--u) * 2) rgba(255, 92, 158, 0.35);
    display: grid; place-items: center;
  }
  .agua { position: absolute; left: 0; right: 0; bottom: 0; height: var(--nivel, 25%); background: linear-gradient(var(--acento2), var(--acento)); transition: height 1s linear; }
  .agua svg { position: absolute; left: 0; bottom: 99%; width: 200%; height: calc(var(--u) * 1.3); animation: mar 2.6s linear infinite; }
  .agua svg.atras { opacity: 0.5; animation-duration: 3.7s; animation-direction: reverse; bottom: 99.5%; height: calc(var(--u) * 1.6); }
  .agua svg path { fill: var(--acento2); }
  @keyframes mar { to { transform: translateX(-50%); } }
  .bolha b {
    position: relative; font-family: var(--titulo); font-weight: 700; font-size: calc(var(--u) * 2.5); color: var(--texto); letter-spacing: 0.02em;
    text-shadow: 0 0 calc(var(--u) * 0.4) #fff, 0 0 calc(var(--u) * 0.4) #fff, 0 0 calc(var(--u) * 0.8) #fff;
    font-variant-numeric: tabular-nums;
  }
  .tempo-txt { min-width: 0; }
  .tempo-txt small { display: block; font-weight: 800; font-size: calc(var(--u) * 0.95); letter-spacing: 0.16em; text-transform: uppercase; color: var(--acento); opacity: 0.85; }
  .tempo-txt p { margin: calc(var(--u) * 0.4) 0 0; font-weight: 800; font-size: calc(var(--u) * 1.65); line-height: 1.25; transition: opacity 0.6s; }
  .tempo-txt p.trocando { opacity: 0; }

  .habilidades { display: flex; flex-direction: column; gap: calc(var(--u) * 0.8); }
  .icones { display: flex; gap: calc(var(--u) * 0.8); }
  .icone { position: relative; width: calc(var(--u) * 4.3); height: calc(var(--u) * 4.3); transition: transform 0.5s; }
  .icone img {
    width: 100%; height: 100%; border-radius: calc(var(--u) * 1); border: calc(var(--u) * 0.28) solid #fff; display: block;
    box-shadow: 0 calc(var(--u) * 0.25) calc(var(--u) * 0.7) rgba(255, 92, 158, 0.3); filter: saturate(0.85);
    transition: box-shadow 0.5s, filter 0.5s;
  }
  .icone b {
    position: absolute; right: calc(var(--u) * -0.5); bottom: calc(var(--u) * -0.5);
    width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); border-radius: 50%; display: grid; place-items: center;
    background: var(--acento); color: #fff; border: calc(var(--u) * 0.2) solid #fff; font-size: calc(var(--u) * 0.9); font-weight: 800;
  }
  .icone.ativa { transform: translateY(calc(var(--u) * -0.5)) scale(1.1); }
  .icone.ativa img { filter: none; box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--acento), 0 calc(var(--u) * 0.5) calc(var(--u) * 1.2) rgba(255, 92, 158, 0.5); }
  .habilidades p { margin: 0; font-weight: 800; font-size: calc(var(--u) * 1.25); transition: opacity 0.4s; }
  .habilidades p em { font-style: normal; color: var(--acento); }

  .camera {
    position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: calc(var(--u) * 1.6);
    border: calc(var(--u) * 0.5) solid #fff;
    box-shadow: 0 0 0 calc(var(--u) * 0.32) var(--acento2), 0 calc(var(--u) * 0.8) calc(var(--u) * 2.4) rgba(255, 92, 158, 0.35);
    display: none; place-items: center; text-align: center;
  }
  .camera span { font-weight: 800; font-size: calc(var(--u) * 1.1); color: #fff; letter-spacing: 0.08em; opacity: 0.85; line-height: 1.5; }
  .com-camera .camera { display: grid; }
  .com-camera .habilidades { display: none; }
  .com-camera h1 { font-size: calc(var(--u) * 4.8); }
  .com-camera .lado { gap: calc(var(--u) * 1.4); }
  .com-camera .bolha { width: calc(var(--u) * 7.6); height: calc(var(--u) * 7.6); }
  .com-camera .bolha b { font-size: calc(var(--u) * 2); }
  .previa .camera { background: rgba(60, 30, 50, 0.55); }
  /* câmera solta: lugar e tamanho escolhidos no gerador (camx, camy, camlargura, camaltura).
     No lugar antigo fica um espaço invisível, pra coluna do título não mudar. */
  .camera.solta { position: fixed; display: grid; width: auto; aspect-ratio: auto; z-index: 2; }
  .camera-espaco { visibility: hidden; }

  /* só a arte da skin, sem nome, raridade nem nome do croma por cima */
  .sem-texto .placa, .sem-texto .croma span, .sem-texto .card::after { display: none; }
  .sem-tempo .tempo .bolha, .sem-tempo .tempo small { display: none; }
  .sem-habilidades .habilidades { display: none; }
  .sem-miniaturas .miniaturas { display: none; }

  /* ---------- tela em pé (9:16) */
  @media (orientation: portrait) {
    :root { --u: min(1.7778vw, 1vh); }
    .palco {
      width: calc(var(--u) * 56.25); height: calc(var(--u) * 100);
      padding: calc(var(--u) * 6) calc(var(--u) * 5);
      grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: calc(var(--u) * 3);
    }
    .lado { order: -1; align-items: center; text-align: center; }
    .lado > .tempo, .lado > .habilidades, .lado > .camera { order: 2; }
    .tempo { justify-content: center; text-align: left; }
    .habilidades { align-items: center; }
    .com-camera .habilidades { display: none; }
  }
</style>
</head>
<body>
<canvas id="ondas"></canvas>

<main class="palco" id="palco">
  <section class="vitrine">
    <div class="card" id="card">
      <div class="placa" id="placa">
        <div class="etiquetas"><span class="etiqueta" id="raridade"></span><span class="etiqueta" id="legado"></span></div>
        <strong id="nomeSkin">Nami</strong>
      </div>
      <div class="croma oculto" id="croma"><div class="bola"><img id="cromaImg" alt=""></div><span id="cromaNome"></span></div>
      <div class="progresso"><i id="barra"></i></div>
    </div>
    <div class="miniaturas" id="miniaturas"></div>
  </section>

  <section class="lado">
    <div class="pilula"><i></i><span id="pilula">League of Legends</span></div>
    <h1 id="titulo">Estou na fila</h1>
    <div class="tempo">
      <div class="bolha" id="bolha">
        <div class="agua" id="agua">
          <svg class="atras" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V 20 H 0 Z"/></svg>
          <svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V 20 H 0 Z"/></svg>
        </div>
        <b id="relogio">0:00</b>
      </div>
      <div class="tempo-txt"><small>tempo na fila</small><p id="recado"></p></div>
    </div>
    <div class="habilidades" id="habilidades"><div class="icones" id="icones"></div><p id="habNome">&nbsp;</p></div>
    <div class="camera" id="camera"><span id="cameraTxt"></span></div>
  </section>
</main>

<script src="ondas.js?v=dev"></script>
<script src="dados.js?v=dev"></script>
<script>
  // Link único: sem nada no link, usa o que foi salvo no gerador e atualiza sozinho.
  // Com opções no link (veja o README), vale o que está no link.
  Ondas.automatico('fila', function (q) {
    var op = Ondas.parametros({
      // borda e Nami nadando (iguais aos da borda.html)
      tema: 'rosa', espessura: 1, velocidade: 1,
      nami: true, tamanho: 1, nado: 'volta', pulo: 25,
      bolhas: true, brilhos: true, enfeites: true,
      // tela de fila
      skins: '', croma: '', troca: 10, aleatorio: false,
      titulo: 'Estou na fila', pilula: 'League of Legends',
      recados: 'Já já começa a partida!|Aproveita pra pegar uma água 💧|Digita !pix, !insta ou !elo no chat',
      tempo: true, habilidades: true, miniaturas: true, camera: false, nomeskin: false,
      // lugar e tamanho da câmera em pixels da tela do OBS (sem isso ela fica no cantinho da coluna)
      camx: -1, camy: -1, camlargura: 0, camaltura: 0, resolucao: '1920x1080'
    }, q);
    var camSolta = op.camera && op.camx >= 0 && op.camy >= 0 && op.camlargura > 0 && op.camaltura > 0;
    var telaRef = op.resolucao.toLowerCase().split('x').map(Number);
    if (!(telaRef[0] > 0 && telaRef[1] > 0)) telaRef = [1920, 1080];

    var tema = Ondas.TEMAS[op.tema] || Ondas.TEMAS.rosa;
    var raiz = document.documentElement.style;
    raiz.setProperty('--acento', tema.acento);
    raiz.setProperty('--acento2', tema.acento2);
    raiz.setProperty('--texto', tema.texto);

    var palco = document.getElementById('palco');
    if (op.camera) palco.classList.add('com-camera');
    if (!op.tempo) palco.classList.add('sem-tempo');
    if (!op.habilidades) palco.classList.add('sem-habilidades');
    if (!op.miniaturas) palco.classList.add('sem-miniaturas');
    if (!op.nomeskin) palco.classList.add('sem-texto');
    if (!Ondas.emOBS) document.body.classList.add('previa');
    // título com os três pontinhos pulando, grudados na última palavra
    (function () {
      var h1 = document.getElementById('titulo'), txt = op.titulo.trim(), corte = txt.lastIndexOf(' ');
      h1.textContent = corte > 0 ? txt.slice(0, corte + 1) : '';
      var fim = document.createElement('span');
      fim.className = 'junto';
      fim.textContent = corte > 0 ? txt.slice(corte + 1) : txt;
      var pontos = document.createElement('span');
      pontos.className = 'pontos';
      pontos.innerHTML = '<i>.</i><i>.</i><i>.</i>';
      fim.appendChild(pontos);
      h1.appendChild(fim);
    })();
    document.getElementById('pilula').textContent = op.pilula;
    if (!op.pilula) document.querySelector('.pilula').style.display = 'none';

    // ------------------------------------------------ fundo do mar + furo da câmera
    var furo = null, bolhasFundo = [];
    if (camSolta) {
      var camEl = document.getElementById('camera'), espaco = document.createElement('div');
      espaco.className = 'camera camera-espaco';
      camEl.parentNode.insertBefore(espaco, camEl);
      document.body.appendChild(camEl);
      camEl.classList.add('solta');
    }
    function posicionaCamera() {
      if (!camSolta) return;
      var el = document.getElementById('camera'), ex = innerWidth / telaRef[0], ey = innerHeight / telaRef[1];
      el.style.left = (op.camx * ex) + 'px';
      el.style.top = (op.camy * ey) + 'px';
      el.style.width = (op.camlargura * ex) + 'px';
      el.style.height = (op.camaltura * ey) + 'px';
    }
    function medirFuro() {
      if (!op.camera) return;
      posicionaCamera();
      var el = document.getElementById('camera'), r = el.getBoundingClientRect();
      var borda = parseFloat(getComputedStyle(el).borderTopWidth) || 0;
      furo = { x: r.left + borda / 2, y: r.top + borda / 2, w: r.width - borda, h: r.height - borda, r: parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0 };
      document.getElementById('cameraTxt').innerHTML = Ondas.emOBS ? '' :
        'sua câmera aqui<br>x ' + Math.round(r.left) + ' · y ' + Math.round(r.top) + ' · ' + Math.round(r.width) + ' × ' + Math.round(r.height);
    }

    function fundo(ctx, W, H, t, u, dt) {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, tema.ceu[0]); g.addColorStop(0.55, tema.ceu[1]); g.addColorStop(1, tema.ceu[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // manchas de luz bem suaves
      var M = Math.max(W, H);
      [[0.18, 0.25, tema.acento2, 0.35], [0.82, 0.7, '#9fe7ee', 0.22], [0.55, 0.05, '#ffffff', 0.7]].forEach(function (m, i) {
        var x = W * (m[0] + Math.sin(t * 0.07 + i * 2) * 0.06), y = H * (m[1] + Math.cos(t * 0.05 + i) * 0.06);
        var rg = ctx.createRadialGradient(x, y, 0, x, y, M * 0.45);
        rg.addColorStop(0, hexA(m[2], m[3])); rg.addColorStop(1, hexA(m[2], 0));
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, H);
      });

      // raios de luz vindo de cima
      for (var i = 0; i < 6; i++) {
        var x = W * (0.06 + i * 0.18) + Math.sin(t * 0.25 + i * 1.7) * W * 0.03;
        var a = W * (0.018 + (i % 3) * 0.008), b = a * 3.2, inc = W * 0.12;
        var lg = ctx.createLinearGradient(0, 0, 0, H * 0.95);
        lg.addColorStop(0, 'rgba(255,255,255,' + (0.42 + 0.18 * Math.sin(t * 0.6 + i)) + ')');
        lg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.moveTo(x - a, 0); ctx.lineTo(x + a, 0); ctx.lineTo(x + b + inc, H); ctx.lineTo(x - b + inc, H);
        ctx.closePath();
        ctx.fill();
      }

      // bolhas subindo do fundo
      if (Math.random() < dt * 3.5) {
        bolhasFundo.push({ x: Math.random() * W, y: H + 20 * u, r: (3 + Math.random() * 9) * u, v: (35 + Math.random() * 45) * u, f: Math.random() * 6.28 });
      }
      ctx.lineWidth = 1.4 * u;
      for (i = bolhasFundo.length - 1; i >= 0; i--) {
        var bo = bolhasFundo[i];
        bo.y -= bo.v * dt;
        if (bo.y < -20 * u) { bolhasFundo.splice(i, 1); continue; }
        var bx = bo.x + Math.sin(t * 1.4 + bo.f) * 8 * u;
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.arc(bx, bo.y, bo.r, 0, 6.2832); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(bx - bo.r * 0.35, bo.y - bo.r * 0.35, bo.r * 0.28, 0, 6.2832); ctx.fill();
      }

      // furo transparente pra câmera (no OBS, a câmera fica embaixo desta fonte)
      if (furo) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(furo.x, furo.y, furo.w, furo.h, furo.r);
        else ctx.rect(furo.x, furo.y, furo.w, furo.h);
        ctx.fill();
        ctx.restore();
      }
    }

    function hexA(hex, a) {
      var n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    op.antes = fundo;
    var borda = Ondas.iniciar(document.getElementById('ondas'), op);
    addEventListener('resize', medirFuro);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(medirFuro);
    medirFuro();
    if (!Ondas.emOBS) addEventListener('pointerdown', function () { borda.pular(); });

    // ------------------------------------------------ tempo na fila
    // a recarga do "Salvar na live" continua contando; abrir a cena de novo começa do zero
    var inicio = Date.now();
    try {
      var comecou = +sessionStorage.getItem('evelinperes-inicio');
      if (Ondas.veioDeRecarga() && comecou) inicio = comecou;
      sessionStorage.setItem('evelinperes-inicio', String(inicio));
    } catch (e) {}
    var relogio = document.getElementById('relogio'), agua = document.getElementById('agua');
    function tique() {
      var s = Math.floor((Date.now() - inicio) / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
      relogio.textContent = (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
      agua.style.setProperty('--nivel', (18 + 64 * (1 - Math.exp(-s / 240))) + '%');
    }
    tique();
    setInterval(tique, 1000);

    // ------------------------------------------------ recados que vão trocando
    var recados = op.recados.split('|').map(function (r) { return r.trim(); }).filter(Boolean);
    var recado = document.getElementById('recado'), iRecado = 0;
    recado.textContent = recados[0] || '';
    if (recados.length > 1) setInterval(function () {
      recado.classList.add('trocando');
      setTimeout(function () {
        iRecado = (iRecado + 1) % recados.length;
        recado.textContent = recados[iRecado];
        recado.classList.remove('trocando');
      }, 600);
    }, 7000);

    // ------------------------------------------------ skins, cromas e habilidades
    NamiDados.carregar().then(function (dados) {
      var porNum = {};
      dados.skins.forEach(function (s) { porNum[s.num] = s; });
      var escolhidas = op.skins ? op.skins.split(',').map(function (n) { return porNum[parseInt(n, 10)]; }).filter(Boolean) : dados.skins.slice();
      if (!escolhidas.length) escolhidas = dados.skins.slice();
      if (op.aleatorio) escolhidas.sort(function () { return Math.random() - 0.5; });
      var cromas = NamiDados.lerCromas(op.croma);
      montaVitrine(escolhidas, cromas);
      montaHabilidades(dados);
    });

    function montaVitrine(lista, cromas) {
      var card = document.getElementById('card'), placa = document.getElementById('placa');
      var mini = document.getElementById('miniaturas'), barra = document.getElementById('barra');
      var troca = Math.max(4, op.troca), gira = lista.length > 1 && op.troca > 0;
      document.documentElement.style.setProperty('--troca', troca + 's');

      var artes = lista.map(function (s) {
        var img = new Image();
        img.className = 'arte';
        img.alt = s.nome;
        img.decoding = 'async';
        img.onerror = function () { if (img.src.indexOf('/centered/') > -1) img.src = NamiDados.splashInteira(s.num); };
        img.src = NamiDados.splash(s.num);
        card.insertBefore(img, card.firstChild);
        return img;
      });

      var minis = lista.map(function (s) {
        var m = new Image();
        m.src = NamiDados.quadrado(s.num);
        m.alt = s.nome;
        mini.appendChild(m);
        return m;
      });
      // miniaturas encolhem quando tem muita skin
      var tam = Math.min(4, 52 / Math.max(1, lista.length) - 0.8);
      document.documentElement.style.setProperty('--mini', 'calc(var(--u) * ' + tam.toFixed(2) + ')');
      if (lista.length < 2) mini.style.display = 'none';

      var atual = -1;
      function mostra(i) {
        var s = lista[i];
        if (atual >= 0) { artes[atual].classList.remove('ativa'); minis[atual].classList.remove('ativa'); }
        // reinicia a animação de zoom
        artes[i].classList.remove('ativa'); void artes[i].offsetWidth; artes[i].classList.add('ativa');
        minis[i].classList.add('ativa');
        placa.classList.add('trocando');
        setTimeout(function () {
          document.getElementById('nomeSkin').textContent = s.nome;
          document.getElementById('raridade').textContent = s.raridade || '';
          document.getElementById('legado').textContent = s.legado ? 'Legado' : '';
          placa.classList.remove('trocando');
        }, atual < 0 ? 0 : 500);
        mostraCroma(s, cromas[s.num]);
        if (gira) { barra.classList.remove('anda'); void barra.offsetWidth; barra.classList.add('anda'); }
        atual = i;
      }
      mostra(0);
      if (gira) setInterval(function () { mostra((atual + 1) % lista.length); }, troca * 1000);
    }

    function mostraCroma(skin, num) {
      var box = document.getElementById('croma');
      var c = (skin.cromas || []).filter(function (x) { return x.num === num; })[0];
      if (!c) { box.classList.add('oculto'); return; }
      var img = document.getElementById('cromaImg');
      img.src = NamiDados.croma(c.num);
      document.getElementById('cromaNome').textContent = 'Croma ' + c.nome;
      box.style.setProperty('--cor-croma', (c.cores && c.cores[0]) || tema.acento);
      box.classList.remove('oculto');
    }

    function montaHabilidades(dados) {
      if (!op.habilidades) return;
      var box = document.getElementById('icones'), nome = document.getElementById('habNome');
      var itens = dados.habilidades.map(function (h) {
        var d = document.createElement('div');
        d.className = 'icone';
        d.innerHTML = '<img alt=""><b></b>';
        d.querySelector('img').src = NamiDados.icone(h, dados.versao);
        d.querySelector('b').textContent = h.tecla;
        box.appendChild(d);
        return d;
      });
      var i = -1;
      function proxima() {
        if (i >= 0) itens[i].classList.remove('ativa');
        i = (i + 1) % itens.length;
        itens[i].classList.add('ativa');
        var h = dados.habilidades[i], em = document.createElement('em');
        em.textContent = h.tecla;
        nome.textContent = ' · ' + h.nome;
        nome.insertBefore(em, nome.firstChild);
      }
      proxima();
      setInterval(proxima, 3500);
    }
  });
</script>
</body>
